name: Upload to App Store Connect

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Unique increasing CFBundleVersion, for example 1.0.1 (use a new value on retry)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mac-app-store-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Build, sign and upload macOS universal app
    if: github.repository == 'vladelaina/BongoCat'
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
      APPLE_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check configuration
        env:
          APPLE_APP_CERTIFICATE_BASE64: ${{ secrets.APPLE_APP_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 packaging/mac-app-store/prepare.py check

      - name: Restore licensed Cubism SDK
        shell: pwsh
        env:
          CUBISM_SDK_ARCHIVE_URL: ${{ secrets.CUBISM_SDK_ARCHIVE_URL }}
          CUBISM_SDK_ARCHIVE_SHA256: ${{ secrets.CUBISM_SDK_ARCHIVE_SHA256 }}
          CUBISM_GLEW_ARCHIVE_URL: ${{ secrets.CUBISM_GLEW_ARCHIVE_URL }}
          CUBISM_GLEW_ARCHIVE_SHA256: ${{ secrets.CUBISM_GLEW_ARCHIVE_SHA256 }}
        run: ./.github/scripts/restore-cubism-sdk.ps1

      - name: Build both architectures and merge app
        run: bash packaging/mac-app-store/build.sh

      - name: Sign app and installer package
        env:
          APPLE_APP_CERTIFICATE_BASE64: ${{ secrets.APPLE_APP_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: bash packaging/mac-app-store/sign.sh

      - name: Save signed package
        uses: actions/upload-artifact@v7
        with:
          name: BongoCat-mac-app-store-${{ inputs.build_number }}
          path: build-app-store/dist/*.pkg
          if-no-files-found: error
          retention-days: 14

      - name: Validate and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          # altool supports API_PRIVATE_KEYS_DIR; keep credentials out of artifacts.
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/bongocat-asc-keys"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          trap 'rm -rf "$API_PRIVATE_KEYS_DIR"' EXIT
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$API_PRIVATE_KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"
          package="build-app-store/dist/BongoCat.pkg"
          xcrun altool --validate-app --file "$package" --type macos \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --file "$package" --type macos \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          {
            echo '### Uploaded to App Store Connect'
            echo 'Apple still needs to process the build. Check TestFlight / build activity for processing errors.'
            echo 'This workflow does not submit the app for review or release it.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing and API credentials
        if: always()
        run: |
          keychain="$RUNNER_TEMP/bongocat-store-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          rm -rf "$RUNNER_TEMP/bongocat-store-signing" "$RUNNER_TEMP/bongocat-asc-keys"
