name: BongoCat CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      sign_windows:
        description: Sign the Windows diagnostic package with the SignPath test certificate
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bongo-cat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality / syntax-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install quality and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build cppcheck \
            libgl1-mesa-dev libx11-dev libxi-dev libxfixes-dev

      - name: Reject legacy product-name references
        run: |
          legacy='l2d''cat'
          if grep -RIni --exclude-dir=.git --exclude-dir=build \
              --exclude='*.png' --exclude='*.flac' "$legacy" .; then
            echo "Legacy product-name reference found"
            exit 1
          fi

      - name: Check source file size policy
        run: cmake -DROOT="$GITHUB_WORKSPACE" -P cmake/CheckLines.cmake

      - name: Run Cppcheck
        shell: bash
        run: |
          mapfile -d '' c_files < <(find src -type f -name '*.c' -print0)
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem --suppress=unknownMacro \
            --std=c11 -Iinclude -Isrc/ui -Isrc/runtime "${c_files[@]}"
          mapfile -d '' cpp_files < <(find src -type f -name '*.cpp' -print0)
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem --suppress=unknownMacro \
            --suppress=passedByValueCallback --std=c++17 \
            -Iinclude -Isrc/ui -Isrc/runtime "${cpp_files[@]}"

      - name: Configure warning-clean Linux build
        run: |
          cmake -S . -B build-quality -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON

      - name: Register GCC diagnostics
        run: echo "::add-matcher::$GITHUB_WORKSPACE/.github/gcc-problem-matcher.json"

      - name: Build
        run: bash .github/scripts/build-unix.sh cmake --build build-quality --parallel 2

      - name: Run native tests
        run: ctest --test-dir build-quality --output-on-failure

  build:
    name: build / ${{ matrix.platform }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgl1-mesa-dev libx11-dev libxi-dev \
            libxfixes-dev

      - name: Configure Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON

      - name: Configure Unix release
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON

      - name: Register GCC diagnostics
        if: runner.os == 'Linux'
        run: echo "::add-matcher::$GITHUB_WORKSPACE/.github/gcc-problem-matcher.json"

      - name: Build Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & ./.github/scripts/build-windows.ps1
          cmake --build build --config Release --parallel 2

      - name: Build Windows validation tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & ./.github/scripts/build-windows.ps1
          cmake --build build --config Release
          --target bongo_cat_validation_tools --parallel 2

      - name: Build Unix release
        if: runner.os != 'Windows'
        run: bash .github/scripts/build-unix.sh cmake --build build --parallel 2

      - name: Test Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & ./.github/scripts/test-windows.ps1
          ctest --test-dir build -C Release --output-on-failure

      - name: Test Unix release
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure

      - name: Resolve release package name
        id: package
        shell: pwsh
        run: |
          $name = (Get-Content build/bongo-cat-package-name.txt -Raw).Trim()
          if ($name -notmatch '^BongoCat-\d+\.\d+\.\d+-(windows|linux|macos)-(x64|x86|arm64|universal)$') {
            throw "Unexpected release package name: $name"
          }
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package release
        shell: pwsh
        run: |
          cmake --build build --config Release --target package
          $archives = @(Get-ChildItem build/dist -File | Where-Object {
            $_.Name -match '\.(zip|tar\.gz)$'
          })
          if ($archives.Count -ne 1) {
            throw "Expected one release archive, found $($archives.Count)"
          }
          $expected = '${{ steps.package.outputs.name }}'
          if (-not $archives[0].Name.StartsWith("$expected.")) {
            throw "Unexpected release archive: $($archives[0].Name)"
          }
          if (-not (Test-Path -LiteralPath "$($archives[0].FullName).sha256")) {
            throw "Release archive checksum is missing"
          }
          @'
          This CI artifact uses the diagnostic renderer because the licensed
          Cubism SDK is not present in the public source checkout. It is for
          startup and platform diagnostics, not end-user distribution.
          '@ | Set-Content build/dist/DIAGNOSTIC-NO-CUBISM.txt -Encoding ascii

      - name: Upload diagnostic build
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-no-cubism-${{ steps.package.outputs.name }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  sign-windows-test:
    name: signing / Windows test certificate
    needs: build
    if: >-
      github.repository == 'vladelaina/BongoCat' &&
      ((github.event_name == 'workflow_dispatch' && inputs.sign_windows) ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
        vars.SIGNPATH_TEST_SIGNING_ENABLED == 'true'))
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
      SIGNPATH_TEST_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_TEST_SIGNING_POLICY_SLUG }}
      SIGNPATH_TEST_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_TEST_CERTIFICATE_THUMBPRINT }}
    steps:
      - name: Checkout signing scripts
        uses: actions/checkout@v5

      - name: Validate SignPath settings
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $required = @(
            'SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG',
            'SIGNPATH_TEST_SIGNING_POLICY_SLUG', 'SIGNPATH_TEST_CERTIFICATE_THUMBPRINT'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing GitHub Actions setting: $name. See docs/signpath.zh-CN.md."
            }
          }
          if ($env:SIGNPATH_TEST_CERTIFICATE_THUMBPRINT -notmatch '^[a-fA-F0-9]{40}$') {
            throw 'SIGNPATH_TEST_CERTIFICATE_THUMBPRINT must contain 40 hexadecimal characters.'
          }

      - name: Download Windows diagnostic package
        uses: actions/download-artifact@v8
        with:
          pattern: diagnostic-no-cubism-BongoCat-*-windows-x64
          path: build/signpath/unsigned
          merge-multiple: true

      - name: Validate unsigned package
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem build/signpath/unsigned -Filter *.zip -File)
          if ($archives.Count -ne 1) { throw 'Expected exactly one Windows ZIP package.' }
          $archive = $archives[0]
          $expected = (Get-Content -LiteralPath "$($archive.FullName).sha256" -Raw).Trim()
          $actual = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw 'Unsigned ZIP checksum mismatch.' }
          if (-not (Test-Path build/signpath/unsigned/DIAGNOSTIC-NO-CUBISM.txt)) {
            throw 'The diagnostic package notice is missing.'
          }

      # Upload only the release ZIP: GitHub wraps it in the outer ZIP expected by SignPath.
      - name: Upload unsigned signing input
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: signpath-unsigned-windows-test
          path: build/signpath/unsigned/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Submit SignPath test signing request
        id: signpath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_TEST_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: build/signpath/signed

      - name: Verify signature and regenerate checksum
        shell: pwsh
        run: |
          & ./.github/scripts/verify-signpath-package.ps1 `
            -SignedDirectory build/signpath/signed `
            -UnsignedDirectory build/signpath/unsigned `
            -ExpectedThumbprint $env:SIGNPATH_TEST_CERTIFICATE_THUMBPRINT

      - name: Upload signed test package
        uses: actions/upload-artifact@v7
        with:
          name: test-signed-diagnostic-no-cubism-windows-x64
          path: build/signpath/signed/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
