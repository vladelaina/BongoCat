name: BongoCat CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bongocat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: quality / tag-version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Validate tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./.github/scripts/check-tag-version.ps1 -Tag $env:GITHUB_REF_NAME

  publishing-policy:
    name: security / publishing-policy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Validate publishing guards
        shell: pwsh
        run: ./.github/scripts/check-publish-guards.ps1 -SelfTest

  quality:
    name: quality / static-analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install quality and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build cppcheck \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev libxfixes-dev \
            libcurl4-openssl-dev libfontconfig1-dev

      - name: Reject legacy product-name references
        run: |
          legacy='l2d''cat'
          if grep -RIni --exclude-dir=.git --exclude-dir=build \
              --exclude='*.png' --exclude='*.flac' "$legacy" .; then
            echo "Legacy product-name reference found"
            exit 1
          fi

      - name: Check source file size policy
        run: cmake -DROOT="$GITHUB_WORKSPACE" -P cmake/CheckLines.cmake

      - name: Check Windows icon dimensions and image data
        run: python3 scripts/check-windows-icon.py

      - name: Check C and C++ safety with Cppcheck
        shell: bash
        run: |
          mapfile -d '' c_files < <(find src -type f -name '*.c' -print0)
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem --suppress=unknownMacro \
            --std=c11 -Iinclude -Isrc/runtime \
            -Isrc/runtime/lifecycle -Isrc/runtime/model \
            -Isrc/runtime/model/import -Isrc/runtime/model/import/mver \
            -Isrc/runtime/model/import/nearby -Isrc/runtime/shell \
            -Isrc/ui/backend -Isrc/ui/preferences -Isrc/ui/rendering \
            -Isrc/ui/theme -Isrc/platform/windows "${c_files[@]}"
          mapfile -d '' cpp_files < <(find src -type f -name '*.cpp' -print0)
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem --suppress=unknownMacro \
            --suppress=passedByValueCallback --std=c++17 \
            -Iinclude -Isrc/runtime -Isrc/runtime/model/import \
            -Isrc/ui/backend -Isrc/ui/preferences -Isrc/ui/rendering \
            -Isrc/ui/theme "${cpp_files[@]}"

      - name: Configure warning-clean Linux build
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -S . -B build-quality -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBONGO_CAT_STATIC_ANALYZER=ON \
            -DBONGO_CAT_OPTIMIZE_RELEASE_SIZE=ON \
            -DBONGO_CAT_OPTIMIZE_RELEASE_IPO=ON \
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON

      - name: Register GCC diagnostics
        run: echo "::add-matcher::$GITHUB_WORKSPACE/.github/gcc-problem-matcher.json"

      - name: Build and analyze C memory safety
        run: bash .github/scripts/build-unix.sh cmake --build build-quality --parallel 2

  clang-tidy:
    name: quality / clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Clang analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 clang-tidy-18 \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev libxfixes-dev \
            libcurl4-openssl-dev libfontconfig1-dev

      - name: Validate Clang-Tidy rules
        run: clang-tidy-18 --verify-config

      - name: Generate compilation database
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build-clang-tidy -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_SIZE=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_IPO=OFF

      - name: Analyze project memory safety and common coding errors
        run: |
          run-clang-tidy-18 -p build-clang-tidy -j 2 \
            -header-filter="^${GITHUB_WORKSPACE}/(include|src)/" \
            "^${GITHUB_WORKSPACE}/src/"

  sanitizers:
    name: quality / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install sanitizer and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 llvm-18 libclang-rt-18-dev \
            xvfb xauth libgl1-mesa-dri libglx-mesa0 \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev libxfixes-dev \
            libcurl4-openssl-dev libfontconfig1-dev

      - name: Configure instrumented application
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build-sanitizers -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_SIZE=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_IPO=OFF \
            -DCMAKE_C_FLAGS="-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build instrumented application
        run: bash .github/scripts/build-unix.sh cmake --build build-sanitizers --target bongo_cat --parallel 2

      - name: Check application memory and undefined behavior
        timeout-minutes: 10
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
          UBSAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
          BONGO_CAT_DISABLE_NEARBY_MODEL_SCAN: '1'
        run: |
          bash .github/scripts/test-unix.sh \
            bash .github/scripts/run-sanitizers.sh \
            "$GITHUB_WORKSPACE/build-sanitizers/BongoCat" \
            "$GITHUB_WORKSPACE/build-sanitizers/reports"

      - name: Upload sanitizer diagnostics
        if: always() && github.repository == 'vladelaina/BongoCat'
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-sanitizers/reports/
            ${{ runner.temp }}/bongocat-native-build.log
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            cmake_arch: x64
          - os: windows-2022
            platform: windows-x86
            cmake_arch: Win32
          - os: ubuntu-24.04
            platform: linux-x64
            cmake_arch: ''
          - os: macos-15-intel
            platform: macos-x64
            cmake_arch: x86_64
          - os: macos-15
            platform: macos-arm64
            cmake_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev \
            libxfixes-dev libcurl4-openssl-dev libfontconfig1-dev

      - name: Configure Unix release
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_SIZE=ON \
            -DBONGO_CAT_OPTIMIZE_RELEASE_IPO=ON \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON

      - name: Register GCC diagnostics
        if: runner.os == 'Linux'
        run: echo "::add-matcher::$GITHUB_WORKSPACE/.github/gcc-problem-matcher.json"

      - name: Build Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/build-windows.ps1 `
            -SkipTests `
            -BuildDir build `
            -Configuration Release `
            -Architecture '${{ matrix.cmake_arch }}' `
            -Jobs 2 `
            -Target ALL_BUILD

      - name: Build Unix release
        if: runner.os != 'Windows'
        run: bash .github/scripts/build-unix.sh cmake --build build --parallel 2

  desktop-package:
    name: package / ${{ matrix.platform }}
    if: >-
      github.repository == 'vladelaina/BongoCat' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            cmake_arch: ''
          - os: macos-15-intel
            platform: macos-x64
            cmake_arch: x86_64
          - os: macos-15
            platform: macos-arm64
            cmake_arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CUBISM_SDK_ARCHIVE_URL: ${{ secrets.CUBISM_SDK_ARCHIVE_URL }}
      CUBISM_SDK_ARCHIVE_SHA256: ${{ secrets.CUBISM_SDK_ARCHIVE_SHA256 }}
      CUBISM_GLEW_ARCHIVE_URL: ${{ secrets.CUBISM_GLEW_ARCHIVE_URL }}
      CUBISM_GLEW_ARCHIVE_SHA256: ${{ secrets.CUBISM_GLEW_ARCHIVE_SHA256 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Restore licensed Cubism SDK
        shell: pwsh
        run: ./.github/scripts/restore-cubism-sdk.ps1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev \
            libxfixes-dev libcurl4-openssl-dev libfontconfig1-dev

      - name: Configure release
        run: |
          cmake -S . -B build-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_SIZE=ON \
            -DBONGO_CAT_OPTIMIZE_RELEASE_IPO=ON \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
            -DBONGO_CAT_REQUIRE_CUBISM=ON \
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON

      - name: Build release
        run: bash .github/scripts/build-unix.sh cmake --build build-package --parallel 2

      - name: Package desktop release
        id: package
        timeout-minutes: 5
        shell: pwsh
        run: |
          $projectVersion = & ./packaging/get-project-version.ps1
          $version = $projectVersion.AppVersion
          $name = (Get-Content build-package/bongocat-package-name.txt -Raw).Trim()
          $platform = "${{ matrix.platform }}"
          if ($name -notmatch "^BongoCat-$([regex]::Escape($version))-$platform$") {
            throw "Cubism desktop package is not production-ready: $name"
          }

          cmake --build build-package --target package
          if ($LASTEXITCODE -ne 0) { throw 'Unix archive packaging failed' }
          $archives = @(Get-ChildItem build-package/dist -File | Where-Object {
            $_.Name -match '\.(zip|tar\.gz)$'
          })
          if ($archives.Count -ne 1) {
            throw "Expected one desktop archive, found $($archives.Count)"
          }
          $packageCheckArgs = @{
            Archive = $archives[0].FullName
            Platform = $platform
            SkipSmoke = $platform.StartsWith('macos-')
          }
          & ./.github/scripts/check-unix-package.ps1 @packageCheckArgs
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "file=$($archives[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload desktop release
        uses: actions/upload-artifact@v7
        with:
          name: bongocat-vt-${{ matrix.platform }}-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          # Preserve package ZIPs inside the artifact transport archive.
          archive: true

  store-package:
    name: package / ${{ matrix.platform }}
    if: >-
      github.repository == 'vladelaina/BongoCat' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            cmake_arch: x64
            store_arch: x64
          - platform: windows-x86
            cmake_arch: Win32
            store_arch: ''
    runs-on: windows-2022
    env:
      CUBISM_SDK_ARCHIVE_URL: ${{ secrets.CUBISM_SDK_ARCHIVE_URL }}
      CUBISM_SDK_ARCHIVE_SHA256: ${{ secrets.CUBISM_SDK_ARCHIVE_SHA256 }}
      CUBISM_GLEW_ARCHIVE_URL: ${{ secrets.CUBISM_GLEW_ARCHIVE_URL }}
      CUBISM_GLEW_ARCHIVE_SHA256: ${{ secrets.CUBISM_GLEW_ARCHIVE_SHA256 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Restore licensed Cubism SDK
        shell: pwsh
        run: ./.github/scripts/restore-cubism-sdk.ps1

      - name: Build Store release
        shell: pwsh
        run: |
          & ./scripts/build-windows.ps1 `
            -SkipTests `
            -BuildDir build-store `
            -Configuration Release `
            -Architecture '${{ matrix.cmake_arch }}' `
            -Jobs 2 `
            -RequireCubism `
            -Target ALL_BUILD

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $projectVersion = & ./packaging/get-project-version.ps1
          "version=$($projectVersion.AppVersion)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: >-
          & ./.github/scripts/install-inno.ps1

      - name: Package Windows desktop release
        id: desktop-package
        shell: pwsh
        run: |
          $name = (Get-Content build-store/bongocat-package-name.txt -Raw).Trim()
          $expected = "BongoCat-${{ steps.version.outputs.version }}-${{ matrix.platform }}"
          if ($name -ne $expected) {
            throw "Cubism desktop package is not production-ready: $name"
          }

          cmake --build build-store --config Release --target package-portable
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows portable packaging failed'
          }
          cmake --build build-store --config Release --target package-installer
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows installer packaging failed'
          }
          $portable = "build-store/dist/$name-portable.exe"
          $setup = "build-store/dist/$name-setup.exe"
          if (-not (Test-Path -LiteralPath $portable)) {
            throw "Production portable package is missing: $portable"
          }
          if (-not (Test-Path -LiteralPath $setup)) {
            throw "Production desktop installer is missing: $setup"
          }
          "portable=$portable" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "file=$setup" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload Windows installer failure log
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: installer-log-${{ matrix.platform }}-${{ github.run_attempt }}
          path: build-store/installer.log
          if-no-files-found: ignore

      - name: Build Microsoft Store MSIX
        if: matrix.store_arch == 'x64'
        shell: pwsh
        run: |
          ./packaging/microsoft-store/build-store-package.ps1 `
            -ExecutablePath "./build-store/Release/BongoCat.exe" `
            -Architecture "${{ matrix.store_arch }}" `
            -OutputDirectory "./store-output"
          $msix = Get-Item "store-output/bongocat_${{ steps.version.outputs.version }}_${{ matrix.store_arch }}.msix"
          Write-Host ("Microsoft Store MSIX size: {0} KB" -f [math]::Round($msix.Length / 1KB, 2))

      - name: Validate Microsoft Store MSIX
        if: matrix.store_arch == 'x64'
        shell: pwsh
        run: |
          ./packaging/microsoft-store/validate-store-package.ps1 `
            -PackagePath "./store-output/bongocat_${{ steps.version.outputs.version }}_${{ matrix.store_arch }}.msix" `
            -ExpectedArchitecture "${{ matrix.store_arch }}"

      - name: Upload Microsoft Store MSIX
        if: matrix.store_arch == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: bongocat-vt-windows-x64-msix-${{ github.run_id }}-${{ github.run_attempt }}
          path: store-output/bongocat_${{ steps.version.outputs.version }}_${{ matrix.store_arch }}.msix
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          # Preserve package ZIPs inside the artifact transport archive.
          archive: true

      - name: Upload Windows desktop release
        uses: actions/upload-artifact@v7
        with:
          name: bongocat-vt-${{ matrix.platform }}-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.desktop-package.outputs.file }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          # Preserve package ZIPs inside the artifact transport archive.
          archive: true

      - name: Upload Windows portable release
        uses: actions/upload-artifact@v7
        with:
          name: bongocat-vt-${{ matrix.platform }}-portable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.desktop-package.outputs.portable }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          # Preserve package ZIPs inside the artifact transport archive.
          archive: true

  virus-total:
    name: security / virustotal
    if: >-
      github.repository == 'vladelaina/BongoCat' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    # CI and releases share the same VirusTotal API quota.
    concurrency:
      group: bongocat-virustotal
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # Discover artifacts while matrix jobs are still building. A single
      # worker owns the rolling request window for every platform.
      - name: Scan artifacts as they become available
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -u .github/scripts/watch-virustotal.py
          --artifact-prefix 'bongocat-vt-'
          --producer-prefix 'package / '

      - name: Add VirusTotal note when scanning is skipped
        if: always() && hashFiles('virustotal-report-*.json') == ''
        run: |
          {
            echo "## VirusTotal scans"
            echo
            echo "No report was produced. Check the scan logs and VIRUSTOTAL_API_KEY configuration."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VirusTotal reports
        if: always() && hashFiles('virustotal-report-*.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: virustotal-ci-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: virustotal-report-*.json
          if-no-files-found: error
          retention-days: 30
